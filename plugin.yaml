name: amessenger
label: AMessenger
kind: platform
version: 0.1.0
description: >
  A messenger for Hermes Agents: a small relay plus a Hermes plugin that lets
  Agents talk to each other under their Owners' eyes.
# Declaring these asks Hermes to import tools.py in CLI and TUI processes, where
# the platform is otherwise deferred and the tools would not exist.
provides_tools:
  - amessenger_agents
  - amessenger_channels
  - amessenger_send
  - amessenger_status
  - amessenger_create_channel
  - amessenger_invite
  - amessenger_leave
  - amessenger_remove_member
provides_hooks:
  - pre_gateway_dispatch
  - transform_llm_output
  - on_stream_end
# Documentation, not configuration. Hermes reads optional_env only for the
# platforms bundled in its own tree, so for an installed plugin these entries
# prompt for nothing and seed nothing. Do not convert them to requires_env
# either: that is an interactive prompt for a secret, and Hermes disables a
# plugin whose requires_env value is left unanswered. Every value below has a
# default or is derived on the first gateway start (see bootstrap.py and
# docs/adr/0008); the Owner supplies only their Redmine API key.
optional_env:
  - name: AMESSENGER_KEY
    description: "Owner's Redmine API key for AMessenger"
    prompt: "AMessenger Owner key"
    password: true
  - name: AMESSENGER_AGENT
    description: "Globally unique AMessenger Agent name"
    prompt: "AMessenger Agent name"
    password: false
  - name: AMESSENGER_KIND
    description: "Agent Kind: corporate or personal"
    prompt: "AMessenger Agent Kind"
    password: false
  - name: AMESSENGER_OWNER_CHAT
    description: "Owner Chat platform, optionally followed by a chat id"
    prompt: "AMessenger Owner Chat"
    password: false
  - name: AMESSENGER_URL
    description: "Relay base URL; overrides the address shipped in defaults.py"
    prompt: "Relay URL (blank keeps the shipped address)"
    password: false
  - name: AMESSENGER_CA_FILE
    description: "PEM file of the CA that signed the relay certificate, when it is not a public one"
    prompt: "Relay CA file (blank trusts the public certificate authorities)"
    password: false
  - name: AMESSENGER_DESCRIPTION
    description: "Description published on the Agent Card"
    prompt: "AMessenger Agent description"
    password: false
  - name: AMESSENGER_OWNER_USER
    description: "Owner's platform user id when the Owner Chat is a group"
    prompt: "AMessenger Owner user id"
    password: false
  - name: AMESSENGER_BASE_TOOLSETS
    description: "Toolsets available at the base Tool Level"
    prompt: "AMessenger base Tool Level toolsets"
    password: false
  - name: AMESSENGER_FULL_TOOLSETS
    description: "Toolsets available at the full Tool Level"
    prompt: "AMessenger full Tool Level toolsets"
    password: false
